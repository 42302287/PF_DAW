<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Jalpa - Arte y Cultura</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Archivo CSS externo -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>

        <!-- Barra de navegación principal -->
        <nav class="navbar navbar-expand-lg" style="background-color: #1E3C2A;">

            <div class="container-fluid">

                <!-- Nombre de la página -->
                <span class="navbar-brand marca-titulo" style="font-weight: bold;">
                    Campus Jalpa Arte y Cultura
                </span>

                <!-- Botón para el menú responsivo -->
                <button class="navbar-toggler ms-auto btn-menu-blanco"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Enlaces de navegación -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#coleccion">
                                Colección
                            </a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
        <!-- Carrusel de imágenes -->
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="imagenes/pintura.jpg"
                         class="d-block w-100"
                         alt="Colección de pinturas">
                </div>

                <div class="carousel-item">
                    <img src="imagenes/artesanias.jpg"
                         class="d-block w-100"
                         alt="Colección de artesanías">
                </div>

                <div class="carousel-item">
                    <img src="imagenes/patrimonio.jpg"
                         class="d-block w-100"
                         alt="Colección de patrimonios">
                </div>

            </div>

            <!-- Controles del carrusel -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExample"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>

        </div>
    </header>
    
</body>
</html>
